<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynasty League HQ — V2.1</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div>
    <small>DYNASTY LEAGUE HQ</small>
    <h1>League Intelligence <span>V2.1</span></h1>
    <p id="meta">Sleeper • syncing...</p>
  </div>
  <button id="sync">Sync Sleeper</button>
</header>
<main>
  <div id="status">Ready to sync.</div>
  <nav id="tabs">
    <button class="active" data-tab="overview">Overview</button>
    <button data-tab="trades">Trades</button>
    <button data-tab="draft">Draft</button>
    <button data-tab="rosters">Rosters</button>
    <button data-tab="history">History</button>
    <button data-tab="grades">Grades</button>
  </nav>
  <div id="app"></div>
</main>
<footer>
  Market values by <a href="https://www.dynastydealer.com/" target="_blank" rel="noreferrer">Dynasty Dealer</a>.
  Data from Sleeper. V2.1 adds contextual trade grading.
</footer>
<script src="app.js"></script>
</body>
</html>
